# clusterrolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-pod-full-access
subjects:
  - kind: ServiceAccount
    name: infrastructure-developer
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-pod-full-access
  apiGroup: rbac.authorization.k8s.io